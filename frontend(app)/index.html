<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- viewport-fit=cover : laisse le contenu s'étendre sous une encoche/coins arrondis sur
         mobile (Android/iOS) — combiné aux marges "env(safe-area-inset-*)" posées dans App.css,
         plutôt qu'une bande de couleur du système autour du contenu. Sans effet sur desktop. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PassManager</title>
    <!-- Anti-flash du thème (voir public/theme-init.js) : chargé le plus tôt possible dans <head>,
         AVANT le CSS de l'app, pour que <html class="dark"> soit déjà posé au moment où la feuille
         de style s'applique — voir aussi src/lib/theme.ts. -->
    <script src="/theme-init.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
