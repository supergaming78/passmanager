services:
  api:
    build: .
    ports:
      # CORRECTIF : port HÔTE (celui de gauche) rendu configurable — 3000 est un port très
      # courant, une collision avec un autre service déjà en place sur le même Docker
      # (fréquent quand plusieurs stacks/conteneurs tournent côte à côte, ex: via Portainer)
      # empêchait le déploiement ("port is already allocated"). Le port CONTENEUR (celui de
      # droite, 3000) reste inchangé — c'est un détail interne, sans lien avec la variable PORT
      # de .env (qui, elle, contrôle sur quel port l'appli ÉCOUTE à l'intérieur du conteneur,
      # jamais changée par ce réglage). Défaut à 13000 si HOST_PORT n'est pas défini — change
      # cette valeur (ou définis HOST_PORT) si 13000 est LUI AUSSI déjà pris chez toi.
      - "${HOST_PORT:-13000}:3000"
    # CORRECTIF : `env_file: - .env` (l'ancienne approche) EXIGE qu'un fichier .env existe
    # PHYSIQUEMENT à côté de ce docker-compose.yml — vrai en local (`docker compose up -d` depuis
    # `backend/`, .env jamais commité, voir le .gitignore racine), mais PLUS via Portainer en mode
    # Stack "Repository" : Portainer clone directement ce dépôt GitHub, où .env n'existe PAS par
    # définition (c'est justement pourquoi il est gitignored) — le déploiement échouerait purement
    # et simplement, fichier introuvable. La substitution `${VAR}` ci-dessous résout ça sans rien
    # perdre pour l'usage local : Docker Compose charge de toute façon automatiquement un .env
    # voisin pour CETTE substitution (mécanisme intégré, différent de la directive `env_file:`
    # utilisée avant), donc le flux local (`.env` + `docker compose up -d`) continue de marcher
    # à l'identique. Côté Portainer : renseigner ces mêmes variables dans l'onglet "Environment
    # variables" du Stack, sans avoir besoin d'aucun fichier — voir
    # backend/README.md#déployer-via-portainer-stack pour la marche à suivre complète, et le
    # tableau de backend/README.md#configuration pour le détail de chaque variable.
    environment:
      # Surcharge l'URL pour pointer vers le volume persistant monté ci-dessous — jamais une
      # valeur à changer, pas de substitution ${...} pour celle-ci.
      - DATABASE_URL=sqlite:/app/data/vault.db
      - JWT_SECRET=${JWT_SECRET}
      - PASSWORD_PEPPER=${PASSWORD_PEPPER}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      # "production" par défaut ICI (contrairement à .env.example, pensé pour `cargo run` en dev
      # locale sans Docker) — ce fichier sert un vrai déploiement : active entre autres l'exigence
      # stricte d'un JWT_SECRET d'au moins 32 caractères (voir config.rs), un garde-fou qu'on veut
      # actif PAR DÉFAUT ici, pas seulement si quelqu'un pense à le régler explicitement.
      - APP_ENV=${APP_ENV:-production}
      - ACCESS_TOKEN_SECONDS=${ACCESS_TOKEN_SECONDS:-600}
      - REFRESH_TOKEN_HOURS=${REFRESH_TOKEN_HOURS:-24}
      - REFRESH_TOKEN_SHORT_SECONDS=${REFRESH_TOKEN_SHORT_SECONDS:-5}
      # http://tauri.localhost + tauri://localhost : OBLIGATOIRES pour que l'app desktop/Android
      # PACKAGÉE (pas juste en mode dev) puisse parler à ce backend — sans les deux, le CORS
      # bloque silencieusement toutes ses requêtes (Windows/Android utilisent le premier, macOS/
      # Linux le second, voir .env.example pour le détail complet). Ajouter chrome-extension://<id>/
      # moz-extension://<uuid> à cette liste si l'extension navigateur est aussi utilisée.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://tauri.localhost,tauri://localhost}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      # Vide par defaut : sans base montee ci-dessous, la geolocalisation reste simplement absente.
      - GEOIP_DATABASE_PATH=${GEOIP_DATABASE_PATH:-}
      # "info" par défaut : le niveau "debug" a un coût réel (formatage de chaînes, bookkeeping
      # de spans) sur CHAQUE requête d'un service qui tourne en continu — à réserver à une session
      # de débogage ponctuelle (repasser cette ligne en debug temporairement), pas à la prod.
      - RUST_LOG=backend=info,tower_http=info
    volumes:
      - ./data:/app/data # Stockage persistant de la base SQLite
      # :ro — l'écran d'état lit l'âge et la taille des sauvegardes (voir health.rs) ; il ne doit
      # jamais pouvoir y écrire. Sans ce montage, l'api ne voit AUCUN fichier et annonce « aucune
      # sauvegarde trouvée » même quand le service backup fonctionne parfaitement : une fausse
      # alerte sur la seule chose qu'on ne veut surtout pas croire à tort.
      - ./backups:/app/backups:ro
    restart: always
    # Utilise le HEALTHCHECK défini dans le Dockerfile (appelle GET /health) pour que Docker
    # sache si le conteneur est réellement opérationnel, pas juste "démarré".
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Téléchargement de la base de géolocalisation (OPTIONNEL, ne tourne jamais tout seul)
  # ---------------------------------------------------------------------------
  # Existe parce que la marche à suivre manuelle du README (`cd backend/data`) n'est pas
  # praticable en Stack Portainer "Repository" : le dossier vit dans le clone géré par Portainer,
  # dont le chemin sur l'hôte n'est pas évident à retrouver. Ce conteneur écrit au bon endroit
  # sans avoir à le chercher.
  #
  # `profiles` le laisse INERTE par défaut : il ne démarre que si COMPOSE_PROFILES=geoip est
  # défini. C'est délibéré — rien ne doit être téléchargé à l'insu du propriétaire du serveur,
  # même une base de données publique.
  #
  # Ce téléchargement ne dit rien de tes utilisateurs : il récupère une base COMPLÈTE, publique et
  # identique pour tout le monde. C'est exactement l'inverse d'une API de géolocalisation, à qui
  # il faudrait envoyer les adresses à résoudre. Une fois le fichier posé, plus aucun accès
  # réseau : les résolutions se font hors ligne (voir src/geoip.rs).
  geoip-init:
    image: alpine:3.21
    profiles: ["geoip"]
    volumes:
      - ./data:/data
    # Ne retélécharge pas si le fichier est déjà là et date de moins de 60 jours : une base
    # vieillit lentement (les attributions d'adresses changent peu), et un redéploiement ne doit
    # pas refaire 8 Mo pour rien.
    #
    # Le fichier du mois courant n'existe pas toujours les premiers jours du mois : on retombe
    # alors sur celui du mois précédent, qui fait parfaitement l'affaire.
    command:
      - sh
      - -c
      - |
        set -e
        cible=/data/dbip-country.mmdb
        echo "=== geoip-init ==="
        echo "Cible : $$cible"
        echo "Contenu actuel du volume /data :"
        ls -la /data || echo "  (le volume /data n'est pas monte !)"
        if [ -f "$$cible" ] && [ -n "$$(find "$$cible" -mtime -60 2>/dev/null)" ]; then
          echo "RESULTAT : base deja presente et recente ($$(wc -c < "$$cible") octets), rien a faire."
          echo "Si la geolocalisation ne marche pas, le probleme n'est PAS ici :"
          echo "  verifie GEOIP_DATABASE_PATH=/app/data/dbip-country.mmdb sur le service api,"
          echo "  puis lis les logs de api (il affiche un diagnostic detaille)."
          exit 0
        fi
        # Sortie d'apk NON masquee : une erreur reseau ici doit etre visible dans les logs.
        apk add --no-cache curl
        # Mois precedent calcule en arithmetique shell, PAS avec `date -d '1 month ago'` : la
        # syntaxe relative est une extension GNU, absente du BusyBox d'Alpine (elle echouerait
        # silencieusement et la reserve ne servirait a rien).
        a=$$(date +%Y); m=$$(date +%m)
        pm=$$((10#$$m - 1)); pa=$$a
        if [ "$$pm" -eq 0 ]; then pm=12; pa=$$((a - 1)); fi
        precedent=$$(printf '%04d-%02d' "$$pa" "$$pm")
        for mois in $$(date +%Y-%m) "$$precedent"; do
          url="https://download.db-ip.com/free/dbip-country-lite-$$mois.mmdb.gz"
          echo "Tentative : $$url"
          if curl -fsSL -o /tmp/geo.gz "$$url"; then
            gunzip -c /tmp/geo.gz > "$$cible"
            taille=$$(wc -c < "$$cible")
            # Une base MMDB valide se termine par le marqueur de metadonnees de MaxMind. Sans cette
            # verification, un telechargement tronque produirait un fichier que api refuserait de
            # lire, sans qu'on sache lequel des deux est en cause.
            if ! grep -q "MaxMind.com" "$$cible"; then
              echo "ECHEC : le fichier telecharge ne ressemble pas a une base MMDB. Supprime."
              rm -f "$$cible"
              exit 1
            fi
            echo "RESULTAT : base installee dans $$cible ($$taille octets, marqueur MMDB present)."
            echo "ETAPE SUIVANTE, sans laquelle rien ne s'affichera :"
            echo "  ajoute GEOIP_DATABASE_PATH=/app/data/dbip-country.mmdb aux variables du stack,"
            echo "  puis redeploie. Le service api confirmera par 'Geolocalisation hors ligne active'."
            exit 0
          fi
        done
        echo "ECHEC : aucune base n'a pu etre telechargee (reseau ? DNS ?). api demarrera SANS geolocalisation."
        exit 1
    restart: "no"

  # Sauvegarde périodique de la base SQLite (voir scripts/backup.sh pour le détail) — conteneur
  # SÉPARÉ de "api" plutôt qu'un cron dans la même image : l'image applicative reste minimale
  # (pas de binaire `sqlite3` CLI, voir Dockerfile), et un souci sur la sauvegarde (ex: disque
  # plein sur ./backups) ne peut jamais faire planter/redémarrer le serveur lui-même.
  # `alpine` + `sqlite` : image très légère, seul le binaire `sqlite3` CLI nécessaire au script.
  #
  # CORRECTIF (repéré face à un vrai déploiement Portainer bloqué en "Restarting" sans log
  # apparent, comme "api" l'a été avant lui) : l'ancienne approche installait `sqlite` au
  # DÉMARRAGE de CHAQUE conteneur (`apk add --no-cache sqlite`, sortie masquée par `>/dev/null`)
  # — un souci réseau ponctuel suffisait à faire échouer ce démarrage, en boucle avec
  # `restart: always`, avec quasiment aucune sortie visible pour comprendre pourquoi. `sqlite` est
  # maintenant installé UNE SEULE FOIS au BUILD de l'image (voir Dockerfile.backup) : plus aucune
  # dépendance réseau au démarrage du conteneur, plus rapide, et le script démarre immédiatement.
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    environment:
      - DB_PATH=/data/vault.db
      - BACKUP_DIR=/backups
      # BACKUP_KEEP_COUNT=3 (pas le défaut de 14, voir scripts/backup.sh) : réglé bas
      # DÉLIBÉRÉMENT pour un serveur à l'espace disque très limité (5-6 Go au total) — ces
      # sauvegardes LOCALES ne servent qu'à un filet de sécurité tout récent (dernières heures/
      # derniers jours), la vraie rétention long terme se fait ailleurs (ex: synchroniser
      # périodiquement ce dossier ./backups vers un NAS séparé — voir ../README.md et
      # backend/README.md#sauvegarde-de-la-base-de-données, cette synchronisation reste À FAIRE
      # SOI-MÊME, ce dépôt ne peut pas le faire à ta place). Avec une base de quelques Mo, 3
      # sauvegardes de plus par rapport à 14 ne changeraient presque rien — mais si le coffre
      # grossit un jour (pièces jointes), la différence devient significative (voir le calcul dans
      # backend/README.md).
      - BACKUP_KEEP_COUNT=3
      # - BACKUP_INTERVAL_SECONDS=86400 (décommenter pour changer la fréquence, en secondes)
    volumes:
      # :ro — ce conteneur ne doit JAMAIS pouvoir écrire dans la base vivante, seulement la lire
      # pour en tirer un instantané cohérent (voir scripts/backup.sh).
      # Plus de montage de scripts/backup.sh ici : il est désormais copié DANS l'image au build
      # (voir Dockerfile.backup) — un rebuild (`docker compose build backup` / redéploiement du
      # Stack Portainer) est donc nécessaire après une modification du script, alors qu'un simple
      # redémarrage suffisait avant. Contrepartie acceptée pour supprimer la dépendance réseau au
      # démarrage (voir plus haut) — ce script change rarement.
      - ./data:/data:ro
      - ./backups:/backups
    restart: always
    depends_on:
      - api

# IMPORTANT — permissions du volume ./data :
# Le conteneur tourne maintenant avec un utilisateur non-root (UID 1000, voir Dockerfile).
# Si ce démarrage échoue avec une erreur "permission denied" sur la BDD SQLite, exécute une fois
# sur l'hôte : `mkdir -p ./data && sudo chown -R 1000:1000 ./data` — pour que ce dossier monté
# appartienne au même UID que l'utilisateur applicatif à l'intérieur du conteneur.
#
# Le service "backup" ci-dessus n'a PAS ce problème : il tourne en root DANS son propre conteneur
# (image `alpine` standard, aucun `user:` défini), ce qui lui permet de lire ./data et d'écrire
# dans ./backups quelle que soit leur propriété côté hôte — aucun `chown` manuel nécessaire pour
# ce service. `./backups` est créé automatiquement par Docker au premier démarrage s'il n'existe
# pas déjà.