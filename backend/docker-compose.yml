services:
  api:
    build: .
    ports:
      - "3000:3000"
    # CORRECTIF : `env_file: - .env` (l'ancienne approche) EXIGE qu'un fichier .env existe
    # PHYSIQUEMENT à côté de ce docker-compose.yml — vrai en local (`docker compose up -d` depuis
    # `backend/`, .env jamais commité, voir le .gitignore racine), mais PLUS via Portainer en mode
    # Stack "Repository" : Portainer clone directement ce dépôt GitHub, où .env n'existe PAS par
    # définition (c'est justement pourquoi il est gitignored) — le déploiement échouerait purement
    # et simplement, fichier introuvable. La substitution `${VAR}` ci-dessous résout ça sans rien
    # perdre pour l'usage local : Docker Compose charge de toute façon automatiquement un .env
    # voisin pour CETTE substitution (mécanisme intégré, différent de la directive `env_file:`
    # utilisée avant), donc le flux local (`.env` + `docker compose up -d`) continue de marcher
    # à l'identique. Côté Portainer : renseigner ces mêmes variables dans l'onglet "Environment
    # variables" du Stack, sans avoir besoin d'aucun fichier — voir
    # backend/README.md#déployer-via-portainer-stack pour la marche à suivre complète, et le
    # tableau de backend/README.md#configuration pour le détail de chaque variable.
    environment:
      # Surcharge l'URL pour pointer vers le volume persistant monté ci-dessous — jamais une
      # valeur à changer, pas de substitution ${...} pour celle-ci.
      - DATABASE_URL=sqlite:/app/data/vault.db
      - JWT_SECRET=${JWT_SECRET}
      - PASSWORD_PEPPER=${PASSWORD_PEPPER}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      # "production" par défaut ICI (contrairement à .env.example, pensé pour `cargo run` en dev
      # locale sans Docker) — ce fichier sert un vrai déploiement : active entre autres l'exigence
      # stricte d'un JWT_SECRET d'au moins 32 caractères (voir config.rs), un garde-fou qu'on veut
      # actif PAR DÉFAUT ici, pas seulement si quelqu'un pense à le régler explicitement.
      - APP_ENV=${APP_ENV:-production}
      - ACCESS_TOKEN_SECONDS=${ACCESS_TOKEN_SECONDS:-600}
      - REFRESH_TOKEN_HOURS=${REFRESH_TOKEN_HOURS:-24}
      - REFRESH_TOKEN_SHORT_SECONDS=${REFRESH_TOKEN_SHORT_SECONDS:-5}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      # "info" par défaut : le niveau "debug" a un coût réel (formatage de chaînes, bookkeeping
      # de spans) sur CHAQUE requête d'un service qui tourne en continu — à réserver à une session
      # de débogage ponctuelle (repasser cette ligne en debug temporairement), pas à la prod.
      - RUST_LOG=backend=info,tower_http=info
    volumes:
      - ./data:/app/data # Stockage persistant de la base SQLite
    restart: always
    # Utilise le HEALTHCHECK défini dans le Dockerfile (appelle GET /health) pour que Docker
    # sache si le conteneur est réellement opérationnel, pas juste "démarré".
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Sauvegarde périodique de la base SQLite (voir scripts/backup.sh pour le détail) — conteneur
  # SÉPARÉ de "api" plutôt qu'un cron dans la même image : l'image applicative reste minimale
  # (pas de binaire `sqlite3` CLI, voir Dockerfile), et un souci sur la sauvegarde (ex: disque
  # plein sur ./backups) ne peut jamais faire planter/redémarrer le serveur lui-même.
  # `alpine` + `sqlite` : image très légère, seul le binaire `sqlite3` CLI nécessaire au script.
  backup:
    image: alpine:3.20
    command: ["sh", "-c", "apk add --no-cache sqlite >/dev/null && sh /scripts/backup.sh"]
    environment:
      - DB_PATH=/data/vault.db
      - BACKUP_DIR=/backups
      # BACKUP_KEEP_COUNT=3 (pas le défaut de 14, voir scripts/backup.sh) : réglé bas
      # DÉLIBÉRÉMENT pour un serveur à l'espace disque très limité (5-6 Go au total) — ces
      # sauvegardes LOCALES ne servent qu'à un filet de sécurité tout récent (dernières heures/
      # derniers jours), la vraie rétention long terme se fait ailleurs (ex: synchroniser
      # périodiquement ce dossier ./backups vers un NAS séparé — voir ../README.md et
      # backend/README.md#sauvegarde-de-la-base-de-données, cette synchronisation reste À FAIRE
      # SOI-MÊME, ce dépôt ne peut pas le faire à ta place). Avec une base de quelques Mo, 3
      # sauvegardes de plus par rapport à 14 ne changeraient presque rien — mais si le coffre
      # grossit un jour (pièces jointes), la différence devient significative (voir le calcul dans
      # backend/README.md).
      - BACKUP_KEEP_COUNT=3
      # - BACKUP_INTERVAL_SECONDS=86400 (décommenter pour changer la fréquence, en secondes)
    volumes:
      # :ro — ce conteneur ne doit JAMAIS pouvoir écrire dans la base vivante, seulement la lire
      # pour en tirer un instantané cohérent (voir scripts/backup.sh).
      - ./data:/data:ro
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    restart: always
    depends_on:
      - api

# IMPORTANT — permissions du volume ./data :
# Le conteneur tourne maintenant avec un utilisateur non-root (UID 1000, voir Dockerfile).
# Si ce démarrage échoue avec une erreur "permission denied" sur la BDD SQLite, exécute une fois
# sur l'hôte : `mkdir -p ./data && sudo chown -R 1000:1000 ./data` — pour que ce dossier monté
# appartienne au même UID que l'utilisateur applicatif à l'intérieur du conteneur.
#
# Le service "backup" ci-dessus n'a PAS ce problème : il tourne en root DANS son propre conteneur
# (image `alpine` standard, aucun `user:` défini), ce qui lui permet de lire ./data et d'écrire
# dans ./backups quelle que soit leur propriété côté hôte — aucun `chown` manuel nécessaire pour
# ce service. `./backups` est créé automatiquement par Docker au premier démarrage s'il n'existe
# pas déjà.