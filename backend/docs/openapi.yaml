openapi: 3.0.3
info:
  title: Backend gestionnaire de mots de passe
  description: >
    API Zero-Knowledge pour un gestionnaire de mots de passe : le serveur ne voit et ne stocke
    jamais le mot de passe maitre d'un utilisateur, ni la cle qui chiffre son coffre. Voir
    docs/API.md pour les explications detaillees (modele d'authentification, invalidation de
    session, rate limiting). La route WebSocket GET /ws n'est pas representable par OpenAPI 3.0
    (pas de support natif) : voir API.md.
  version: "1.0.0"
servers:
  - url: http://localhost:3000
    description: Local / Docker Compose

security: []

tags:
  - name: auth
    description: Inscription, connexion, gestion de session et de compte
  - name: vault
    description: Coffre-fort (CRUD, corbeille, import/export, synchronisation)
  - name: devices
    description: Appareils de confiance
  - name: emergency
    description: Acces d'urgence (contact de confiance, delai d'attente, coffre en lecture seule)
  - name: sharing
    description: Partage securise d'une entree, instantane (meme construction que emergency)
  - name: sync
    description: Synchronisation temps reel (ticket WebSocket)
  - name: admin
    description: Administration
  - name: misc
    description: Divers

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Inscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthPayload' }
      responses:
        '201':
          description: Compte cree (non verifie). Corps texte brut "OK", pas de JSON.
          content:
            text/plain:
              schema: { type: string, example: "OK" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Confirme le code de verification envoye a l'inscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailPayload' }
      responses:
        '200': { description: Email verifie }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/resend-verification:
    post:
      tags: [auth]
      summary: Renvoie un nouveau code de verification
      description: Reponse 202 dans tous les cas (anti-enumeration de comptes).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordPayload' }
      responses:
        '202': { description: Traite (email inconnu ou deja verifie -> aucun effet, silencieusement) }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [auth]
      summary: Connexion
      description: >
        Sur un appareil deja approuve, une IP jamais vue pour CET appareil (fenetre glissante des 5
        plus recentes) declenche une alerte email best-effort + une entree d'audit
        LOGIN_NEW_IP_DETECTED - jamais bloquant. Aucune alerte au tout premier login d'un appareil
        qui vient d'etre approuve (deja couvert par l'alerte "nouvel appareil" de /auth/verify-device).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthPayload' }
      responses:
        '200':
          description: Appareil de confiance, tokens emis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginSuccessResponse' }
        '202':
          description: Appareil inconnu, 2FA requis (code envoye par email)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TfaRequiredResponse' }
        '400':
          description: Email pas encore verifie, OU compte temporairement bloque pour trop d'echecs recents (anti-bruteforce par compte, 15 min glissantes apres 5 echecs - voir docs/API.md)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/verify-device:
    post:
      tags: [auth]
      summary: Valide le code 2FA et enregistre l'appareil comme appareil de confiance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyTfaPayload' }
      responses:
        '200': { description: "Appareil valide. Rappeler /auth/login ensuite pour obtenir les tokens." }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rafraichit l'access token via le refresh token (rotation a usage unique)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshPayload' }
      responses:
        '200':
          description: Nouveau couple de tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResponse' }
        '401':
          description: Refresh token invalide, expire, ou deja utilise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Deconnecte un seul appareil (revoque son refresh token)
      description: Aucune authentification requise - la connaissance du refresh token suffit. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshPayload' }
      responses:
        '204': { description: Deconnecte (ou deja deconnecte) }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password:
    put:
      tags: [auth]
      summary: Change volontairement le mot de passe maitre (avec re-chiffrement complet du coffre)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeMasterPasswordPayload' }
      responses:
        '200': { description: "Mot de passe change. Toutes les sessions (et access tokens deja emis) sont invalidees." }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/email:
    put:
      tags: [auth]
      summary: Change l'adresse email du compte
      description: "Depuis l'extension navigateur (Origin chrome-extension://.../moz-extension://...) : refuse avec 403 sauf pour un admin ou un compte explicitement autorise (voir can_change_email_via_extension sous GET /me). L'app desktop n'est jamais concernee par cette restriction."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEmailPayload' }
      responses:
        '200': { description: "Email change. Toutes les sessions (et access tokens deja emis) sont invalidees." }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403':
          description: Changement d'email refuse depuis l'extension (non autorise pour ce compte)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me:
    get:
      tags: [auth]
      summary: Profil de l'utilisateur connecte
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /audit/me:
    get:
      tags: [auth]
      summary: Historique de securite self-service (compte connecte uniquement)
      description: >
        Contrairement a /audit (reserve aux administrateurs, tous comptes confondus), ne renvoie
        que les 100 entrees les plus recentes du compte APPELANT.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Initie une reinitialisation de mot de passe oublie
      description: Reponse 202 dans tous les cas (anti-enumeration de comptes).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordPayload' }
      responses:
        '202': { description: Traite }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Confirme le code de reinitialisation et applique le nouveau mot de passe
      description: >
        ATTENTION : purge integralement le coffre (aucune cle de l'ancien mot de passe pour
        re-chiffrer quoi que ce soit dans ce flux).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmResetPayload' }
      responses:
        '200': { description: "Mot de passe reinitialise, coffre purge, sessions invalidees." }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /vault:
    get:
      tags: [vault]
      summary: Liste les entrees actives du coffre (favoris en premier)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VaultEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [vault]
      summary: Ajoute une entree au coffre
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultEntryInput' }
      responses:
        '201': { description: Entree creee }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /vault/{id}:
    put:
      tags: [vault]
      summary: Modifie une entree existante
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VaultEntryId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultEntryInput' }
      responses:
        '200': { description: Entree modifiee }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [vault]
      summary: Supprime une entree (suppression douce, vers la corbeille)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VaultEntryId' }
      responses:
        '204': { description: Deplacee vers la corbeille }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /vault/{id}/favorite:
    patch:
      tags: [vault]
      summary: Bascule le statut favori d'une entree
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VaultEntryId' }
      responses:
        '200': { description: Statut bascule }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /vault/{id}/history:
    get:
      tags: [vault]
      summary: Historique des mots de passe d'une entree (plus recent en premier)
      description: >
        Archive automatiquement quand PUT /vault/{id} recoit password_changed=true. Plafonne a
        20 versions par entree (les plus anciennes sont purgees automatiquement au-dela).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VaultEntryId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PasswordHistoryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /vault/{id}/attachments:
    post:
      tags: [vault]
      summary: Ajoute une piece jointe chiffree a une entree
      description: >
        Nom de fichier ET contenu CHIFFRES cote client, le serveur ne les lit ni ne les valide
        jamais. Accepte des requetes jusqu'a 16 Mo (voir main.rs).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VaultEntryId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultAttachmentInput' }
      responses:
        '201':
          description: Creee
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [vault]
      summary: Liste les pieces jointes d'une entree, SANS leur contenu
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VaultEntryId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VaultAttachmentMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /vault/{id}/attachments/{attachment_id}:
    get:
      tags: [vault]
      summary: Recupere une piece jointe complete (avec son contenu chiffre)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VaultEntryId' }
        - { $ref: '#/components/parameters/AttachmentId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultAttachment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [vault]
      summary: Supprime definitivement une piece jointe
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VaultEntryId' }
        - { $ref: '#/components/parameters/AttachmentId' }
      responses:
        '204': { description: Supprimee }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /vault/history/export:
    post:
      tags: [vault]
      summary: Exporte l'integralite de l'historique de mots de passe (reste chiffre)
      description: >
        A recuperer, re-chiffrer cote client, puis renvoyer dans reencrypted_history lors d'un
        changement de mot de passe maitre (PUT /auth/password).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportVaultPayload' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PasswordHistoryEntry' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /vault/trash:
    get:
      tags: [vault]
      summary: Liste les entrees dans la corbeille
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrashedVaultEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /vault/{id}/restore:
    post:
      tags: [vault]
      summary: Restaure une entree de la corbeille
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VaultEntryId' }
      responses:
        '200': { description: Entree restauree }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /vault/{id}/permanent:
    delete:
      tags: [vault]
      summary: Supprime definitivement une entree deja dans la corbeille
      description: Echoue sur une entree active (doit d'abord passer par DELETE /vault/{id}).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VaultEntryId' }
      responses:
        '204': { description: Supprimee definitivement }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /vault/import:
    post:
      tags: [vault]
      summary: Importe en bloc un ensemble d'entrees (tout ou rien)
      description: >
        Chaque entree devient une NOUVELLE ligne, jamais de fusion/ecrasement de l'existant.
        Accepte des requetes jusqu'a 256 Mo.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportVaultPayload' }
      responses:
        '201':
          description: Import reussi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /vault/export:
    post:
      tags: [vault]
      summary: Exporte l'integralite du coffre actif (reste chiffre)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportVaultPayload' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VaultEntry' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/vault/sync:
    get:
      tags: [vault]
      summary: Etat resume du coffre, pour savoir s'il faut re-synchroniser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/vault/sync-check:
    get:
      tags: [vault]
      summary: Alias historique de GET /api/vault/sync (meme handler)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /devices:
    get:
      tags: [devices]
      summary: Liste les appareils de confiance
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrustedDevice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /devices/{device_id}:
    delete:
      tags: [devices]
      summary: Revoque un appareil de confiance (coupe aussi sa session active)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: device_id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoque }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /devices/limit:
    put:
      tags: [devices]
      summary: Modifie le plafond d'appareils de confiance
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDeviceLimitPayload' }
      responses:
        '200': { description: Plafond mis a jour }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /devices/logout-all:
    post:
      tags: [devices]
      summary: Deconnexion totale volontaire (tous les appareils, y compris l'appelant)
      description: Aucune reconfirmation de mot de passe requise. Ferme aussi les access tokens deja emis et toute connexion WebSocket (/ws) deja ouverte pour ce compte.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Toutes les sessions revoquees }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /emergency/keys:
    put:
      tags: [emergency]
      summary: Enregistre ou remplace sa propre paire de cles X25519
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserKeysInput' }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /emergency/keys/me:
    get:
      tags: [emergency]
      summary: Ses propres cles (publique ET privee chiffree)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserKeysInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /emergency/keys/{email}:
    get:
      tags: [emergency]
      summary: Cle PUBLIQUE d'un autre utilisateur uniquement (jamais sa cle privee)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: email
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublicKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /emergency/contacts:
    post:
      tags: [emergency]
      summary: Designe un nouveau contact de confiance (invitation par email)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddEmergencyContactPayload' }
      responses:
        '201':
          description: Cree
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [emergency]
      summary: Contacts designes par l'utilisateur connecte (proprietaire)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmergencyContact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /emergency/granted-to-me:
    get:
      tags: [emergency]
      summary: Relations ou l'utilisateur connecte est le contact designe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmergencyContact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /emergency/contacts/{id}:
    delete:
