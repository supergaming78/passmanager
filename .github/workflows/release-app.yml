# Construit et publie l'app desktop (Windows/macOS/Linux) ET l'app Android sur GitHub Releases, à
# chaque tag `app-v*` — un SEUL tag/une seule version pour les deux, dans la MÊME release (préfixe
# dédié, pas juste `v*`, pour ne pas entrer en collision avec de futurs tags backend/extension dans
# ce même dépôt).
#
# ⚠️ NON EXÉCUTÉ EN VRAI à l'écriture de ce fichier (pas de dépôt GitHub encore créé) — écrit du
# mieux possible à partir de la doc officielle Tauri/tauri-action, mais à déboguer pour de vrai au
# premier tag poussé, comme n'importe quel nouveau pipeline CI.
#
# Ce que fait le job `desktop` (via `tauri-apps/tauri-action`, en une étape) : compile pour chaque
# OS du matrix, SIGNE les installeurs (secret TAURI_SIGNING_PRIVATE_KEY, voir le `.gitignore`
# racine pour comment cette clé a été générée), génère le manifeste `latest.json` que le plugin
# updater interroge (voir tauri.conf.json::plugins.updater), et publie tout ça en brouillon sur une
# nouvelle GitHub Release.
#
# Ce que fait le job `android` : compile un APK universel signé (`tauri android build --apk`, PAS
# `--aab` — un `.aab` n'est installable que via le Play Store, qu'on n'utilise pas ici), puis
# l'ajoute comme asset SUPPLÉMENTAIRE à la MÊME release que le job `desktop` vient de créer (attend
# `needs: desktop`, puis retrouve la release par son tag via `softprops/action-gh-release` plutôt
# que d'en créer une seconde). C'est cet APK que l'app Android va lier en clair dans sa bannière
# "nouvelle version disponible" (voir src/lib/mobileUpdateCheck.ts) — PAS d'installation automatique
# possible côté Android (confirmation système obligatoire à l'installation d'un APK, même signé).
#
# Secrets à créer une seule fois (Settings > Secrets and variables > Actions, sur ce dépôt) :
# - TAURI_SIGNING_PRIVATE_KEY          : contenu de frontend(app)/src-tauri/tauri-updater.key
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD : le mot de passe généré avec cette clé
# - ANDROID_KEYSTORE_BASE64   : `base64 -w0 passmanager-release.keystore` (le fichier généré
#   localement, voir frontend(app)/src-tauri/gen/android/.gitignore — jamais commité)
# - ANDROID_KEYSTORE_PASSWORD : mot de passe du keystore (et de la clé, générés identiques ici)
# - ANDROID_KEY_ALIAS         : "passmanager" (alias utilisé à la génération du keystore)
# (GITHUB_TOKEN est fourni automatiquement par GitHub Actions, pas besoin de le créer)
#
# Ce que fait le job `ios` — EXPÉRIMENTAL, voir la conversation du 2026-09-01 : l'utilisateur n'a
# PAS de compte Apple Developer payant (99$/an, autrement obligatoire pour toute signature Apple
# "normale") — construit donc volontairement un .ipa NON SIGNÉ. Ce .ipa n'est PAS installable tel
# quel : chaque personne (utilisateur ou famille/amis) doit le signer lui-même avec SON PROPRE
# Apple ID gratuit via AltStore/SideStore + AltServer (existe en version Windows, pas besoin de
# Mac) — voir le README pour la marche à suivre. Aucun secret Apple à créer : ce job ne signe
# rien, ne connaît aucun compte Apple.
#
# Recette VALIDÉE par un vrai run (voir la conversation du 2026-09-01, mise au point dans le
# workflow temporaire `ios-test.yml` avant d'être portée ici, ce dernier maintenant supprimé) —
# `tauri ios build` DOIT réellement tourner (pas un `xcodebuild` manuel séparé) : la phase de
# build Xcode "Build Rust Code" se connecte à un pont WebSocket/JSON-RPC hébergé par le PROCESSUS
# `tauri ios build` lui-même pour récupérer ses options (cible, etc.) — un `xcodebuild archive`
# manuel, même avec un faux fichier addr, échoue avec "Connection refused" (rien n'écoute côté
# serveur). `tauri ios build` n'a lui-même aucun flag pour désactiver la signature (vérifié contre
# la doc CLI officielle) : sans configuration, Xcode refuse même de démarrer ("requires a
# development team"), avant d'atteindre cette phase. Solution : désactiver la signature au niveau
# du PROJET Xcode généré (project.pbxproj, via le gem Ruby `xcodeproj`) plutôt qu'en ligne de
# commande — `tauri ios build` n'a alors plus rien à outrepasser. Avec ça, `tauri ios build` va
# jusqu'au bout de l'ARCHIVE (le pont RPC se connecte, Rust compile), mais échoue à la toute
# dernière étape (`-exportArchive`, qui exige un vrai teamID) — attendu et sans conséquence :
# xcodebuild écrit l'archive AVANT de tenter l'export, donc un .xcarchive valide reste sur disque
# malgré l'échec global de la commande (`|| true`), récupéré et empaqueté à la main juste après (un
# .ipa n'étant qu'un .app zippé dans un dossier "Payload/", pas besoin d'un export officiel qui
# exigerait, lui, une vraie signature).
name: Release app

on:
  push:
    tags:
      - "app-v*"

# CORRECTIF, trouvé au run précédent : "Error: Resource not accessible by integration" en essayant
# de créer la release — le GITHUB_TOKEN fourni automatiquement est en LECTURE SEULE par défaut sur
# les dépôts créés récemment (réglage de sécurité GitHub), quel que soit ce que les secrets/étapes
# du workflow font par ailleurs. `contents: write` ici, explicitement dans le fichier, évite de
# dépendre d'un réglage caché dans Settings > Actions > General à retrouver/changer sur GitHub —
# le workflow reste portable et fonctionne tel quel sur n'importe quel dépôt.
permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
          - platform: "macos-latest"
          - platform: "ubuntu-latest"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Installer les dépendances système Linux (webkit2gtk, etc.)
        if: matrix.platform == 'ubuntu-latest'
        # CORRECTIF : liste vérifiée contre les prérequis officiels Tauri v2 (v2.tauri.app/start/
        # prerequisites), pas seulement écrite de mémoire — deux erreurs réelles trouvées : (1)
        # `libappindicator3-dev` n'existe plus/entre en conflit sur les Ubuntu récents (22.04+,
        # dont `ubuntu-latest`), remplacé par `libayatana-appindicator3-dev` — l'ancien nom aurait
        # fait échouer `apt-get install` lui-même, avant même toute compilation ; (2)
        # `libxdo-dev`/`libssl-dev` manquaient, requis au lien par Tauri mais PAS forcément déjà
        # présents sur l'image `ubuntu-latest` (contrairement à `build-essential`/`curl`/`wget`/
        # `file`, déjà là sur toute image Ubuntu CI standard, gardés quand même par exhaustivité).
        # `patchelf` conservé en plus (nécessaire à l'empaquetage AppImage, absent de cette liste
        # officielle mais requis par un autre maillon de la chaîne de build Tauri).
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "frontend(app)/package-lock.json"

      - name: Installer les dépendances npm
        working-directory: frontend(app)
        run: npm ci

      # CORRECTIF, trouvé au tout premier run réel : "failed to decode secret key ... Invalid
      # symbol 10, offset 348" — un retour à la ligne parasite (symbole 10 = \n) s'était glissé à la
      # fin de la valeur du secret TAURI_SIGNING_PRIVATE_KEY (probablement ajouté par le
      # copier-coller dans le formulaire GitHub, un piège classique et facile à reproduire). Plutôt
      # que de compter sur un copier-coller parfait à chaque fois qu'un secret est recréé, cette
      # étape nettoie systématiquement tout retour à la ligne en trop AVANT de passer les valeurs à
      # tauri-action. `::add-mask::` EXPLICITE sur chaque valeur nettoyée avant de l'écrire dans
      # GITHUB_OUTPUT : le masquage automatique de GitHub ne reconnaît que la valeur EXACTE d'un
      # secret déjà enregistré — une version tronquée (même juste d'un octet) est une chaîne
      # DIFFÉRENTE à ses yeux, qui ne serait sinon plus masquée dans le reste des logs de ce run.
      - name: Nettoyer les secrets de signature (retours à la ligne parasites)
        id: clean-secrets
        shell: bash
        run: |
          clean_key="$(printf '%s' "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\n\r')"
          clean_password="$(printf '%s' "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" | tr -d '\n\r')"
          echo "::add-mask::$clean_key"
          echo "::add-mask::$clean_password"
          printf 'key<<__EOF__\n%s\n__EOF__\n' "$clean_key" >> "$GITHUB_OUTPUT"
          printf 'password<<__EOF__\n%s\n__EOF__\n' "$clean_password" >> "$GITHUB_OUTPUT"

      # CORRECTIF (retour utilisateur, 2026-09-02) : le guide utilisateur n'était visible qu'une
      # fois un installeur téléchargé et le dossier ouvert — rien sur la page de release elle-même.
      # tauri-action n'a pas d'option pour lire releaseBody depuis un fichier (juste une chaîne en
      # ligne, voir sa doc) : lu ici et passé en sortie multi-lignes (même technique que pour les
      # secrets ci-dessus) plutôt que codé en dur dans le YAML.
      - name: Lire le guide utilisateur (pour le corps de la release)
        id: guide
        run: printf 'content<<__EOF__\n%s\n__EOF__\n' "$(cat GUIDE_UTILISATEUR.md)" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.clean-secrets.outputs.key }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.clean-secrets.outputs.password }}
          # CORRECTIF, trouvé au run précédent : "Error: No artifacts were found" alors que le
          # build ET l'empaquetage avaient RÉUSSI (voir les logs — .dmg/.app/.tar.gz.sig bien
          # produits). Cause : ce dépôt est un WORKSPACE Cargo (voir Cargo.toml racine, qui inclut
          # frontend(app)/src-tauri comme membre) — Cargo met alors TOUJOURS la sortie de build dans
          # UN SEUL `target/` À LA RACINE DU DÉPÔT, partagé entre tous les membres, jamais un
          # `target/` local à chaque membre. tauri-action, lui, cherche les artefacts à l'endroit
          # conventionnel d'un projet Tauri SANS workspace (`frontend(app)/src-tauri/target/`) — un
          # dossier qui n'existe tout simplement pas ici. CARGO_TARGET_DIR force Cargo à écrire là où
          # tauri-action regarde, sans rien changer au reste (dev local inclus, cette variable n'est
          # définie que pour cette étape de CI).
          CARGO_TARGET_DIR: ${{ github.workspace }}/frontend(app)/src-tauri/target
        with:
          projectPath: "frontend(app)"
          tagName: app-v__VERSION__
          releaseName: "PassManager v__VERSION__"
          releaseBody: ${{ steps.guide.outputs.content }}
          # CORRECTIF (retour utilisateur, 2026-09-02) : voulait un changelog affiché SOUS le titre
          # de version sur la page de release GitHub — PAS un fichier séparé dans le dépôt (essayé
          # d'abord via un CHANGELOG.md maintenu à la main, retiré ensuite). `generateReleaseNotes`
          # délègue entièrement à la fonctionnalité NATIVE de GitHub (celle du bouton "Generate
          # release notes") : à la création, GitHub liste automatiquement les commits/PR fusionnées
          # depuis le tag `app-v*` précédent, sans aucun fichier ni entretien manuel de notre côté.
          # Quand `releaseBody` est ALSO fourni (le guide, ci-dessus), GitHub le met AVANT ces notes
          # générées plutôt que de choisir l'un ou l'autre (comportement documenté de l'API Releases
          # de GitHub, repris tel quel par cette option de tauri-action).
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false

  android:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Installer le NDK Android
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "frontend(app)/package-lock.json"

      - name: Installer les dépendances npm
        working-directory: frontend(app)
        run: npm ci

      # Même précaution que côté desktop (voir son commentaire "Nettoyer les secrets de signature")
      # — un retour à la ligne parasite dans ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS ferait
      # échouer la signature Android avec un mot de passe qui ne correspondrait plus exactement à
      # celui donné à `keytool` lors de la génération du keystore (voir le README pour le détail).
      - name: Nettoyer les secrets Android (retours à la ligne parasites)
        id: clean-android-secrets
        shell: bash
        run: |
          clean_password="$(printf '%s' "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | tr -d '\n\r')"
          clean_alias="$(printf '%s' "${{ secrets.ANDROID_KEY_ALIAS }}" | tr -d '\n\r')"
          echo "::add-mask::$clean_password"
          echo "::add-mask::$clean_alias"
          printf 'password<<__EOF__\n%s\n__EOF__\n' "$clean_password" >> "$GITHUB_OUTPUT"
          printf 'alias<<__EOF__\n%s\n__EOF__\n' "$clean_alias" >> "$GITHUB_OUTPUT"

      - name: Décoder le keystore de signature Android
        working-directory: frontend(app)/src-tauri/gen/android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\n\r' | base64 --decode > passmanager-release.keystore

      - name: Construire l'APK Android (signé, universel)
        working-directory: frontend(app)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # CHEMIN ABSOLU obligatoire (${{ github.workspace }} = racine du checkout) — CORRECTIF :
          # un chemin relatif ici (essayé d'abord) ne se résout PAS par rapport au `working-directory`
          # de CETTE étape (`frontend(app)`) comme on pourrait s'y attendre, mais par rapport au
          # répertoire du module Gradle qui le lit (`file(it)` dans app/build.gradle.kts, exécuté
          # depuis .../gen/android/app/) — un chemin relatif écrit en pensant au premier aurait donc
          # pointé nulle part pour le second, faisant échouer la signature au premier vrai run.
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/frontend(app)/src-tauri/gen/android/passmanager-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.clean-android-secrets.outputs.password }}
          ANDROID_KEY_ALIAS: ${{ steps.clean-android-secrets.outputs.alias }}
          ANDROID_KEY_PASSWORD: ${{ steps.clean-android-secrets.outputs.password }}
        # Pas de `--target`/`--split-per-abi` : tous les ABI par défaut, regroupés dans un seul APK
        # "universel" — un seul lien de téléchargement à donner dans la bannière de mise à jour,
        # au prix d'un fichier un peu plus gros que des APK par-architecture.
        run: npm run tauri android build -- --apk

      - name: Supprimer le keystore décodé (ne doit pas survivre au job)
        if: always()
        working-directory: frontend(app)/src-tauri/gen/android
        run: rm -f passmanager-release.keystore

      - name: Ajouter l'APK à la release déjà créée par le job desktop
        uses: softprops/action-gh-release@v2
        env:
          # CORRECTIF : sans ce token explicite, cette étape échoue à l'authentification — le
          # `GITHUB_TOKEN` fourni automatiquement par Actions n'est PAS repris automatiquement par
          # cette action tierce, contrairement à `tauri-apps/tauri-action` ci-dessus (qui, lui, le
          # lit bien depuis son propre bloc `env:`, présent) — chaque action tierce doit le recevoir
          # explicitement.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # `github.ref_name`, sur un déclenchement par tag, EST DÉJÀ le nom complet du tag
          # (ex: "app-v1.2.3") — pas la partie après "app-v" seule. Rajouter le préfixe ici
          # produirait "app-vapp-v1.2.3", un tag qui ne correspondrait à AUCUNE release existante.
          tag_name: ${{ github.ref_name }}
          # CORRECTIF, trouvé au premier vrai run : job "réussi" mais l'APK absent de la release —
          # ce chemin ne correspondait à rien (aucune erreur levée pour autant, juste 0 fichier
          # uploadé en silence). Sans `--split-per-abi`, Tauri place l'APK "universel" sous un
          # sous-dossier `universal/` supplémentaire (`.../apk/universal/release/`), pas directement
          # sous `.../apk/release/` comme pour un build avec cibles séparées — vérifié contre le
          # comportement documenté de Tauri, pas juste deviné une seconde fois.
          # GUIDE_UTILISATEUR.md ajouté ici (demande explicite, 2026-09-02) : déjà affiché sur la
          # page de release (voir releaseBody du job desktop plus haut), mais aussi disponible en
          # fichier téléchargeable à côté des installeurs — pas de raison de le refaire dans le job
          # ios (même release, un seul exemplaire suffit).
          files: |
            frontend(app)/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            GUIDE_UTILISATEUR.md
          # IMPORTANT : `draft: true` est nécessaire ici pour PRÉSERVER le brouillon créé par le
          # job desktop — si ce champ est omis, cette action publie automatiquement la release en
          # l'ajoutant, ce qui la rendrait visible aux utilisateurs AVANT toute relecture manuelle.
          draft: true

  ios:
    needs: desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # aarch64-apple-ios : cible RÉELLE (iPhone/iPad physiques) — pas besoin des cibles simulateur
      # (aarch64-apple-ios-sim/x86_64-apple-ios) pour un .ipa destiné à être sideloadé sur un vrai
      # appareil.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "frontend(app)/package-lock.json"

      - name: Installer les dépendances npm
        working-directory: frontend(app)
        run: npm ci

      # Requis AVANT `tauri ios init` : ce dernier embarque le contenu déjà buildé de `dist/` dans
      # le projet Xcode généré (même raison que `beforeBuildCommand` dans tauri.conf.json pour le
      # desktop/Android, mais `tauri ios init` ne le déclenche pas tout seul).
      - name: Construire le frontend web
        working-directory: frontend(app)
        run: npm run build

      # `--ci` : évite toute invite interactive (choix de l'équipe de signature notamment).
      - name: Générer le projet Xcode (gen/apple, jamais commité — régénéré à chaque run)
        working-directory: frontend(app)
        run: npx tauri ios init --ci

      # CORRECTIF (voir le commentaire en tête de fichier sur le job `ios`) : désactive la
      # signature au niveau du PROJET Xcode généré (project.pbxproj) plutôt qu'en ligne de
      # commande — `tauri ios build`, appelé juste après, n'a alors plus rien à outrepasser. Le gem
      # Ruby `xcodeproj` (Ruby déjà présent sur les runners macOS) est l'outil fiable pour éditer un
      # .pbxproj correctement (format OpenStep, pas du XML standard — un sed/perl à l'aveugle serait
      # fragile).
      - name: Désactiver la signature au niveau du projet Xcode généré
        working-directory: frontend(app)/src-tauri/gen/apple
        run: |
          set -e
          gem install xcodeproj --no-document
          project=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1)
          ruby -rxcodeproj -e "
            project = Xcodeproj::Project.open('$project')
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
                config.build_settings['DEVELOPMENT_TEAM'] = ''
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              end
            end
            project.save
          "
          echo "Signature désactivée dans $project"

      # Échec attendu à la toute dernière étape (export du .ipa signé, qui exige un compte Apple
      # même avec le projet configuré "sans signature") — mais l'archive .xcarchive elle-même a
      # déjà été écrite sur le disque AVANT cette étape (deux étapes séparées et séquentielles dans
      # xcodebuild). `|| true` : récupérée nous-mêmes juste après, peu importe le code de sortie.
      - name: "Tenter tauri ios build (l'archive doit réussir même si l'export final échoue)"
        working-directory: frontend(app)
        run: npx tauri ios build --ci -t aarch64 --export-method debugging || true

      # `tauri_cli` place l'archive dans un dossier de travail à lui, pas l'emplacement Xcode par
      # défaut (~/Library/Developer/Xcode/{DerivedData,Archives}, tous les deux vides) — recherche
      # large plutôt qu'un chemin figé en dur.
      - name: Chercher le .xcarchive produit malgré l'échec de l'export
        run: |
          set -e
          archive_path=$(find "$HOME" /private/var/folders /tmp "frontend(app)" -name "*.xcarchive" -type d 2>/dev/null | head -1)
          if [ -z "$archive_path" ]; then
            echo "Aucun .xcarchive trouvé. Diagnostic :"
            find "frontend(app)/src-tauri/gen/apple" -maxdepth 4 2>/dev/null || true
            find / -name "*.xcarchive" -type d 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "Archive trouvée : $archive_path"
          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

      # Un .xcarchive n'est pas directement installable — un .ipa n'est qu'un fichier .app zippé
      # dans un dossier "Payload/" (format documenté, voir la doc Apple sur la distribution
      # d'apps) : pas besoin d'export officiel (celui-ci exigerait, lui, une vraie signature).
      - name: Empaqueter le .app en .ipa non signé
        run: |
          set -e
          app_path=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          echo "App : $app_path"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qr unsigned.ipa Payload)
          mkdir -p "frontend(app)/src-tauri/gen/apple/build"
          mv "$RUNNER_TEMP/unsigned.ipa" "frontend(app)/src-tauri/gen/apple/build/PassManager-unsigned.ipa"

      - name: Ajouter le .ipa à la release déjà créée par le job desktop
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: "frontend(app)/src-tauri/gen/apple/build/PassManager-unsigned.ipa"
          draft: true
