# Construit et publie l'extension navigateur en paquet téléchargeable (zip) sur GitHub Releases, à
# chaque tag `ext-v*` — préfixe dédié séparé de `app-v*` (voir release-app.yml), une release GitHub
# indépendante puisque l'extension a son propre numéro de version (extension/manifest.json), pas lié
# à celui de l'app desktop/Android.
#
# PAS de Chrome Web Store ici (payant, refusé) — le zip reste la seule voie pour Chrome/Edge
# ("mode développeur" + "charger l'extension non empaquetée"), à destination de quiconque n'a pas ce
# dépôt cloné en local.
#
# Firefox, en revanche, EXIGE une signature Mozilla pour toute installation permanente (pas
# d'équivalent du "mode développeur" de Chrome pour un usage durable) — mais ça reste GRATUIT et
# automatisable : `web-ext sign --channel=unlisted` avec des clés API AMO (voir la conversation du
# 2026-09-01) ne PUBLIE rien publiquement sur addons.mozilla.org, ça produit juste un .xpi signé par
# Mozilla, installable directement (PC ET Android) sans mode développeur ni manipulation compliquée.
# Secrets nécessaires (Settings > Secrets and variables > Actions) : `AMO_JWT_ISSUER`/`AMO_JWT_SECRET`
# (générés sur addons.mozilla.org/developers/addon/api/key/, comptes développeur gratuits).
#
# Contenu du zip : uniquement ce que manifest.json référence réellement (manifest.json, icons/,
# popup/dist/ — reconstruit ici en deux temps : wasm-pack PUIS npm build, ni l'un ni l'autre n'est
# committé, voir .gitignore) + le guide. PAS popup/src, popup/node_modules, wasm-bindings/src,
# extension-key.pem (jamais committé de toute façon, voir .gitignore — inutile ici : c'est la clé
# PUBLIQUE dérivée qui est déjà figée dans manifest.json::key, la clé privée ne sert qu'à la
# régénérer si besoin, pas à distribuer l'extension telle quelle).
name: Release extension

on:
  push:
    tags:
      - "ext-v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "extension/popup/package-lock.json"

      # CORRECTIF (premier run réel) : `wasm-bindings/pkg-web` est en fait GITIGNORÉ (voir
      # .gitignore racine, ligne "extension/wasm-bindings/pkg-web/") — présent en local uniquement
      # parce que déjà construit une fois à la main (voir extension/README.md#construire), jamais
      # committé. Sans cette étape, `npm run build` du popup échoue immédiatement (`tsc`) avec
      # "Cannot find module '../../../wasm-bindings/pkg-web/wasm_bindings.js'". `jetli/wasm-pack-action`
      # télécharge un binaire wasm-pack prêt à l'emploi (rapide) plutôt que `cargo install wasm-pack`
      # (compilation complète, bien plus lent).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Construire le module WASM (wasm-bindings/pkg-web)
        working-directory: extension/wasm-bindings
        run: wasm-pack build --target web --out-dir pkg-web

      - name: Installer les dépendances npm du popup
        working-directory: extension/popup
        run: npm ci

      - name: Construire le popup (produit popup/dist/)
        working-directory: extension/popup
        run: npm run build

      - name: Assembler le paquet
        run: |
          set -e
          version=$(node -p "require('./extension/manifest.json').version")
          echo "Version de l'extension : $version"
          staging="PassManager-extension-$version"
          mkdir -p "$staging"
          cp extension/manifest.json "$staging/"
          cp -r extension/icons "$staging/"
          mkdir -p "$staging/popup"
          cp -r extension/popup/dist "$staging/popup/dist"
          cp extension/GUIDE_INSTALLATION.md "$staging/"
          # CORRECTIF (premier run réel) : zipper "$staging" lui-même (plutôt que SON CONTENU)
          # place manifest.json sous un dossier interne du même nom que le zip — l'extraction
          # "Extraire tout" de Windows crée alors un SECOND dossier par-dessus (mêmes noms), donnant
          # un manifest.json à DEUX niveaux d'imbrication au lieu d'un seul ("fichier manifeste
          # absent" en pointant sur le dossier extrait de premier niveau, qui ne contient qu'un
          # sous-dossier). `cd` dans "$staging" avant de zipper avec `.` : manifest.json atterrit à
          # la RACINE de l'archive, un seul niveau de dossier quel que soit l'outil d'extraction.
          (cd "$staging" && zip -qr "../PassManager-extension-$version.zip" .)
          echo "PACKAGE_PATH=PassManager-extension-$version.zip" >> "$GITHUB_ENV"
          echo "STAGING_DIR=$staging" >> "$GITHUB_ENV"

      # Signe le MÊME contenu (staging, pas extension/ brut — pas de popup/src ni node_modules
      # dans le .xpi final) via l'API AMO. `--channel=unlisted` : signé par Mozilla, installable
      # directement, mais jamais listé publiquement sur addons.mozilla.org. Étape entièrement
      # SAUTÉE (via check-amo ci-dessous) sans bloquer le reste du job si les secrets AMO ne sont
      # pas encore configurés — le zip Chrome/Edge reste publié dans tous les cas.
      # `secrets.*` n'est pas utilisable directement dans un `if:` d'étape (rejeté par le
      # validateur de workflow) — passe par une variable de sortie intermédiaire à la place.
      - name: Vérifier si les secrets AMO sont configurés
        id: check-amo
        env:
          HAS_AMO_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
        run: echo "configured=$([ -n "$HAS_AMO_ISSUER" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # CORRECTIF (premier run réel) : "WebExtError: Upload failed: Unauthorized / Unknown JWT iss
      # (issuer)" — même piège déjà rencontré avec TAURI_SIGNING_PRIVATE_KEY (voir release-app.yml) :
      # un retour à la ligne parasite s'était glissé au copier-coller du secret dans le formulaire
      # GitHub. Nettoyage systématique AVANT de passer les valeurs à web-ext, comme pour les
      # secrets de signature desktop/Android.
      - name: Nettoyer les secrets AMO (retours à la ligne parasites)
        if: steps.check-amo.outputs.configured == 'true'
        id: clean-amo
        run: |
          clean_issuer="$(printf '%s' "${{ secrets.AMO_JWT_ISSUER }}" | tr -d '\n\r')"
          clean_secret="$(printf '%s' "${{ secrets.AMO_JWT_SECRET }}" | tr -d '\n\r')"
          echo "::add-mask::$clean_issuer"
          echo "::add-mask::$clean_secret"
          printf 'issuer<<__EOF__\n%s\n__EOF__\n' "$clean_issuer" >> "$GITHUB_OUTPUT"
          printf 'secret<<__EOF__\n%s\n__EOF__\n' "$clean_secret" >> "$GITHUB_OUTPUT"

      - name: Signer pour Firefox (unlisted, .xpi permanent)
        if: steps.check-amo.outputs.configured == 'true'
        env:
          WEB_EXT_API_KEY: ${{ steps.clean-amo.outputs.issuer }}
          WEB_EXT_API_SECRET: ${{ steps.clean-amo.outputs.secret }}
        run: |
          set -e
          npx --yes web-ext sign \
            --source-dir "$STAGING_DIR" \
            --artifacts-dir web-ext-artifacts \
            --channel unlisted \
            --ignore-files "GUIDE_INSTALLATION.md"
          xpi_path=$(find web-ext-artifacts -maxdepth 1 -name "*.xpi" | head -1)
          echo "XPI trouvé : $xpi_path"
          echo "XPI_PATH=$xpi_path" >> "$GITHUB_ENV"

      - name: Publier la release GitHub (brouillon)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "Extension PassManager ${{ github.ref_name }}"
          # CORRECTIF (retour utilisateur, 2026-09-02) : le guide n'était visible qu'une fois le
          # zip/xpi téléchargé et ouvert — rien sur la page de release elle-même. body_path (natif
          # à cette action, contrairement à tauri-action utilisé par release-app.yml qui n'a que du
          # texte en ligne, voir son propre correctif équivalent) affiche directement le contenu du
          # guide sur la page de release.
          body_path: extension/GUIDE_INSTALLATION.md
          # XPI_PATH reste vide (donc ignoré par cette action) si les secrets AMO n'étaient pas
          # configurés — voir l'étape de signature ci-dessus.
          files: |
            ${{ env.PACKAGE_PATH }}
            ${{ env.XPI_PATH }}
          # draft: relecture manuelle avant publication effective — même choix de prudence que
          # release-app.yml (voir son commentaire équivalent).
          draft: true
          # CORRECTIF (retour utilisateur, 2026-09-02) : le vrai auto-updater de l'app desktop
          # (tauri.conf.json::plugins.updater.endpoints) dépend de "releases/latest/download/..." —
          # sans ce réglage, publier une release d'EXTENSION après une release d'APP volait le badge
          # "Latest" du dépôt à cette dernière, cassant la vérification de mise à jour du desktop
          # jusqu'à correction manuelle. "Latest" reste réservé aux releases app-v* (release-app.yml,
          # jamais touché ici) — celle-ci n'est jamais candidate, quelle que soit sa date.
          make_latest: "false"

      # CORRECTIF (retour utilisateur, 2026-09-02) : Firefox vérifie périodiquement
      # browser_specific_settings.gecko.update_url (voir manifest.json) — un fichier JSON qu'on
      # tient nous-mêmes à jour ici, committé directement dans le dépôt (accessible anonymement via
      # raw.githubusercontent.com maintenant que le dépôt est PUBLIC) plutôt que de dépendre de
      # "releases/latest", ambigu sur ce dépôt qui mélange plusieurs types de tags (app-v*/ext-v*) —
      # "latest" pourrait pointer vers une release app-v* sans rapport. update_link vise l'asset de
      # CE tag précisément (jamais "latest"), donc jamais cette ambiguïté. update_hash (sha256)
      # permet à Firefox de vérifier l'intégrité du téléchargement avant installation.
      #
      # ATTENTION (limite acceptée) : la release reste en BROUILLON tant que l'utilisateur ne l'a
      # pas publiée à la main (voir draft: true ci-dessus) — ses assets ne sont PAS accessibles
      # publiquement avant ça, même une fois ce commit poussé. Il existe donc une fenêtre où
      # updates.json annonce une version dont le lien de téléchargement 404 encore. Accepté :
      # Firefox ne vérifie que toutes les 24h par défaut et réessaiera automatiquement plus tard —
      # publier la release rapidement après ce run reste la bonne pratique.
      - name: Mettre à jour extension/updates.json (auto-update Firefox)
        if: steps.check-amo.outputs.configured == 'true'
        run: |
          set -e
          version=$(node -p "require('./extension/manifest.json').version")
          gecko_id=$(node -p "require('./extension/manifest.json').browser_specific_settings.gecko.id")
          xpi_filename=$(basename "$XPI_PATH")
          update_link="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$xpi_filename"
          hash="sha256:$(sha256sum "$XPI_PATH" | cut -d' ' -f1)"
          node -e "
            const fs = require('fs');
            const path = 'extension/updates.json';
            let data = { addons: {} };
            try { data = JSON.parse(fs.readFileSync(path, 'utf8')); } catch {}
            if (!data.addons['$gecko_id']) data.addons['$gecko_id'] = { updates: [] };
            const updates = data.addons['$gecko_id'].updates.filter((u) => u.version !== '$version');
            updates.push({ version: '$version', update_link: '$update_link', update_hash: '$hash' });
            data.addons['$gecko_id'].updates = updates;
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extension/updates.json
          git commit -m "chore(extension): mise à jour updates.json pour la version $version [skip ci]" || echo "Rien à committer (updates.json déjà à jour)"
          git push origin HEAD:main
