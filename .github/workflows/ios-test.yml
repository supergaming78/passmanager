# Workflow TEMPORAIRE — sert uniquement à itérer sur le job `ios` de release-app.yml sans devoir
# pousser un nouveau tag `app-v*` (qui déclencherait aussi tout le reste : desktop + Android,
# ~15-20 min à chaque essai, pour rien tant que ce job précis n'est pas fiable). Déclenchable
# manuellement (`workflow_dispatch`, onglet Actions → ce workflow → "Run workflow") — PAS de
# déclencheur automatique. À SUPPRIMER une fois le job `ios` de release-app.yml confirmé fiable
# (voir la conversation du 2026-09-01) : il duplique volontairement sa logique le temps de la mise
# au point, garder les deux à jour indéfiniment n'aurait aucun sens.
name: Test build iOS (temporaire)

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "frontend(app)/package-lock.json"

      - name: Installer les dépendances npm
        working-directory: frontend(app)
        run: npm ci

      - name: Construire le frontend web
        working-directory: frontend(app)
        run: npm run build

      - name: Générer le projet Xcode (gen/apple)
        working-directory: frontend(app)
        run: npx tauri ios init --ci

      # CORRECTIF (voir la conversation du 2026-09-01) : `tauri ios build` invoque xcodebuild SANS
      # jamais désactiver la signature lui-même (aucun flag CLI pour ça, voir la doc officielle) —
      # Xcode refuse alors de démarrer le moindre build ("requires a development team"), avant même
      # d'atteindre la phase "Build Rust Code" (qui, elle, a besoin du pont RPC géré par le
      # PROCESSUS `tauri ios build` — un `xcodebuild` manuel séparé ne peut donc pas s'y substituer,
      # essayé et échoué au tour précédent). Solution : désactiver la signature au niveau du PROJET
      # Xcode lui-même (project.pbxproj), pas via la ligne de commande — `tauri ios build` n'a alors
      # plus rien à changer, le projet déclare déjà "aucune signature requise" pour Xcode. Le gem
      # Ruby `xcodeproj` (Ruby déjà présent sur les runners macOS) est l'outil fiable pour éditer un
      # .pbxproj correctement (format OpenStep, pas du XML standard — un sed/perl à l'aveugle serait
      # fragile).
      - name: Désactiver la signature au niveau du projet Xcode généré
        working-directory: frontend(app)/src-tauri/gen/apple
        run: |
          set -e
          gem install xcodeproj --no-document
          project=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1)
          ruby -rxcodeproj -e "
            project = Xcodeproj::Project.open('$project')
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
                config.build_settings['DEVELOPMENT_TEAM'] = ''
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              end
            end
            project.save
          "
          echo "Signature désactivée dans $project"

      # Échec possible malgré tout à la toute dernière étape (export du .ipa signé, qui exige un
      # compte Apple même avec le projet configuré "sans signature") — mais l'archive .xcarchive
      # elle-même devrait avoir été écrite sur le disque AVANT cette étape (deux étapes séparées et
      # séquentielles). `|| true` : récupérée nous-mêmes juste après, peu importe le code de sortie.
      - name: "Tenter tauri ios build (l'archive doit réussir même si l'export final échoue)"
        working-directory: frontend(app)
        run: npx tauri ios build --ci -t aarch64 --export-method debugging || true

      - name: Chercher un .xcarchive produit malgré l'échec de l'export
        run: |
          set -e
          archive_path=$(find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 2 -name "*.xcarchive" 2>/dev/null | head -1)
          if [ -z "$archive_path" ]; then
            archive_path=$(find "$HOME/Library/Developer/Xcode/Archives" -name "*.xcarchive" 2>/dev/null | head -1)
          fi
          if [ -z "$archive_path" ]; then
            echo "Aucun .xcarchive trouvé — tauri ios build a probablement échoué AVANT l'archive elle-même."
            echo "Contenu de DerivedData pour diagnostic :"
            find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 3 2>/dev/null || true
            exit 1
          fi
          echo "Archive trouvée : $archive_path"
          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

      - name: Empaqueter le .app en .ipa non signé
        run: |
          set -e
          app_path=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          echo "App : $app_path"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qr unsigned.ipa Payload)
          mkdir -p "$GITHUB_WORKSPACE/out"
          mv "$RUNNER_TEMP/unsigned.ipa" "$GITHUB_WORKSPACE/out/PassManager-unsigned.ipa"

      # Simple artefact téléchargeable depuis la page du run — pas de release/tag impliqué ici,
      # juste vérifier que le .ipa se produit correctement pendant la mise au point.
      - uses: actions/upload-artifact@v4
        with:
          name: PassManager-unsigned-ipa
          path: out/PassManager-unsigned.ipa
